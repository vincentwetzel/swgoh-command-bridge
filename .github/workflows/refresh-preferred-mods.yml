name: Refresh preferred mods

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      COMLINK_BASE_URL: ${{ secrets.COMLINK_BASE_URL }}
      PREFERRED_MODS_DATASET_URL: https://raw.githubusercontent.com/vincentwetzel/swgoh-command-bridge/main/data/preferred-mods/dataset.json
      PREFERRED_MODS_MAX_ACCOUNTS: "250"
      PREFERRED_MODS_MIN_PROFILES: "100"
      PREFERRED_MODS_CONCURRENCY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate aggregated preferred-mod dataset
        run: dotnet run --project tools/swgoh-command-bridge.PreferredModsPublisher -- data/preferred-mods
      - name: Commit refreshed dataset
        run: |
          if git diff --quiet -- data/preferred-mods; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preferred-mods
          git commit -m "chore: refresh preferred mod dataset"
          git push
